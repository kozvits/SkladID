# Project-wide Gradle settings.

# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure to make it clearer which packages are bundled
# with the Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use non-transitive R classes (faster builds, recommended default since AGP 7+)
android.nonTransitiveRClass=true

# Kotlin code style for this project
kotlin.code.style=official

# AGP 8.5.2 was only tested up to compileSdk 34; this project targets 35.
# Suppress the warning until AGP is upgraded.
android.suppressUnsupportedCompileSdk=35
