name: Build SkladID
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew || true
      - name: Check wrapper jar
        run: ls -la gradle/wrapper/ || echo "wrapper jar missing"
      - name: Build (system gradle fallback)
        timeout-minutes: 10
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            bash ./gradlew assembleDebug --no-daemon
          else
            echo "gradle-wrapper.jar missing — using system gradle"
            gradle assembleDebug --no-daemon || echo "system gradle not available"
          fi
