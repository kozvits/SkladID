name: Build SkladID
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew || true
      - name: Check wrapper jar
        run: ls -la gradle/wrapper/ || echo "wrapper jar missing"
      - name: Build (with timeout)
        timeout-minutes: 10
        run: bash ./gradlew assembleDebug --no-daemon
