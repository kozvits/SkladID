name: Build SkladID
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle and cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Build
        timeout-minutes: 20
        run: bash ./gradlew assembleDebug --no-daemon

      - name: List APK outputs
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -20
          ls -la app/build/outputs/ 2>/dev/null || echo "app/build/outputs not found"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "app/build/outputs/apk not found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "app/build/outputs/apk/debug not found"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app-debug.apk"
          retention-days: 7